<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Autenticação Bem-Sucedida - RPG de Mesa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f1115;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: #181c24;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            margin-top: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Aventura Iniciada!</h2>
        <p>Sua identidade foi confirmada com sucesso pelos deuses da autenticação. O ritual está completo.</p>
        <div class="badge">Pode fechar esta aba e retornar ao aplicativo</div>
    </div>
</body>
</html>
