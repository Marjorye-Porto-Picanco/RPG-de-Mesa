<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RPGdeMesa</title>
    <base href="/" />
    <style>
        :root {
            --rpg-fundo-base: #20150f;
        }

        html, html > body, #app {
            min-height: 100%;
            margin: 0;
            background-color: var(--rpg-fundo-base);
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background-color: var(--rpg-fundo-base);
        }

        .loading-mascot {
            display: block;
            width: min(56vw, 240px, 65vh);
            height: auto;
        }
    </style>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="RPGdeMesa.styles.css" />
    <link rel="icon" type="image/svg+xml" href="img/logo_rpg_de_mesa.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="loading-screen" role="status" aria-label="Carregando o RPG de Mesa">
            <img class="loading-mascot" src="img/mascote-carregamento.png" width="607" height="720" alt="Mascote do RPG de Mesa" />
            <div class="loading-dots" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/dialogos.js" defer></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

</body>

</html>
